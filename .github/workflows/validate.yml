name: Validate vendor pack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required files and reserved IDs
        shell: pwsh
        run: |
          $required = @(
            'Build-Forever-Vendors.ps1',
            'Custom-ADD_GM_ISLAND_VENDORS_FOREVER.sql',
            'Custom-REMOVE_GM_ISLAND_VENDORS_FOREVER.sql',
            'FOREVER_VENDOR_AUDIT.md',
            'WOWHEAD_FOREVER_VERIFIED_IDS.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required file: $path"
            }
          }

          $install = Get-Content -LiteralPath 'Custom-ADD_GM_ISLAND_VENDORS_FOREVER.sql' -Raw
          $remove = Get-Content -LiteralPath 'Custom-REMOVE_GM_ISLAND_VENDORS_FOREVER.sql' -Raw
          foreach ($id in 990000..990018) {
            if ($install -notmatch "(?<!\d)$id(?!\d)") {
              throw "Install script does not contain vendor entry $id"
            }
          }
          if ($remove -notmatch '990000' -or $remove -notmatch '990018') {
            throw 'Removal script does not cover the documented reserved range.'
          }

      - name: Parse builder script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Build-Forever-Vendors.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
